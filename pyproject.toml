[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reelbrief"
version = "0.2.0"
description = "Turns saved Instagram reels into structured summaries and resources."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
